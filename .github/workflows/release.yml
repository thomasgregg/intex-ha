name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release and HACS ZIP asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Build integration ZIP
        run: >-
          git archive
          --format=zip
          --output="$RUNNER_TEMP/intex_sx2100.zip"
          HEAD:custom_components/intex_sx2100

      - name: Upload integration ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/intex_sx2100.zip"
          --clobber
