name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release and HACS ZIP asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build integration ZIP
        run: >-
          git archive
          --format=zip
          --output="$RUNNER_TEMP/intex_sx2100.zip"
          HEAD:custom_components/intex_sx2100

      - name: Verify integration ZIP
        run: |
          unzip -t "$RUNNER_TEMP/intex_sx2100.zip"
          unzip -l "$RUNNER_TEMP/intex_sx2100.zip" | grep -q ' manifest.json$'

      - name: Create draft release with HACS ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/intex_sx2100.zip"
          --draft
          --generate-notes
          --title "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
